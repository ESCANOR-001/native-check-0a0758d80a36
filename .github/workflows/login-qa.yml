name: Remodex sign-in QA
on:
  push:
    branches: [codex/onboard-login-ci-20261119]
permissions:
  contents: read
jobs:
  macos-menu:
    runs-on: macos-15
    timeout-minutes: 6
    steps:
      - name: Check Fast User Switching accessibility
        shell: bash
        run: |
          sudo defaults write /Library/Preferences/.GlobalPreferences MultipleSessionEnabled -bool YES
          defaults -currentHost write com.apple.controlcenter UserSwitcher -int 18
          defaults write com.apple.controlcenter 'NSStatusItem Visible UserSwitcher' -bool YES
          killall ControlCenter || true
          sleep 4
          osascript <<'APPLESCRIPT'
          tell application "System Events"
            tell process "ControlCenter"
              set descriptions to {}
              repeat with menuItem in menu bar items of menu bar 1
                set end of descriptions to (description of menuItem as text)
              end repeat
              return descriptions
            end tell
          end tell
          APPLESCRIPT
