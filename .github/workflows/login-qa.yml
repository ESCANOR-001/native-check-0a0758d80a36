name: Remodex sign-in QA
on:
  push:
    branches: [codex/onboard-login-ci-20261119]
permissions:
  contents: read
jobs:
  macos:
    name: macOS actual sign-out and sign-in
    runs-on: macos-15
    environment: onboard-login-check-20261119
    timeout-minutes: 24
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Unpack isolated source snapshot
        env:
          REMODEX_ONBOARD_QA_SNAPSHOT_KEY: ${{ secrets.REMODEX_ONBOARD_QA_SNAPSHOT_KEY }}
        run: |
          node unseal.mjs "$RUNNER_TEMP/native-source.tar.gz"
          mkdir native-source
          tar -xf "$RUNNER_TEMP/native-source.tar.gz" -C native-source
          rm "$RUNNER_TEMP/native-source.tar.gz"
      - name: Build Remodex
        working-directory: native-source/opencodex-runtime/experiments/rust-connect
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --locked --bin remodex-connect-native
      - name: Choose Yes and verify relaunch at sign-in
        timeout-minutes: 10
        run: bash macos-login.sh "$PWD/native-source/opencodex-runtime/experiments/rust-connect/target/debug/remodex-connect-native"
