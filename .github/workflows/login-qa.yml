name: Remodex sign-in QA
on:
  push:
    branches: [codex/onboard-login-ci-20261119]
permissions:
  contents: read
jobs:
  host:
    name: Check sign-in test environment on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Inspect Windows test session
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          whoami
          Get-Process -Id $PID | Format-List SessionId
          Get-Process explorer -ErrorAction SilentlyContinue | Format-Table SessionId
          & "$env:WINDIR\System32\query.exe" session
          Get-Service TermService,Schedule | Format-Table Name,Status,StartType
          Get-ItemPropertyValue 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' fDenyTSConnections
          Test-Path 'C:\msys64\usr\bin\pacman.exe'
          python --version
      - name: Inspect macOS test session
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          id -un
          stat -f '%Su' /dev/console
          if launchctl print "gui/$(id -u)" >/dev/null; then echo "GUI domain exists"; fi
          candidate='/System/Library/CoreServices/Menu Extras/User.menu/Contents/Resources/CGSession'
          if test -x "$candidate"; then echo 'CGSession exists'; else echo 'CGSession unavailable'; fi
          /usr/sbin/automationmodetool status || true
          cat >/tmp/rmx-probe.swift <<'SWIFT'
          import CoreGraphics
          import ApplicationServices
          import Foundation
          print("Event access", CGPreflightPostEventAccess())
          print("Accessibility", AXIsProcessTrusted())
          print("Display size", CGDisplayPixelsWide(CGMainDisplayID()), CGDisplayPixelsHigh(CGMainDisplayID()))
          SWIFT
          swift /tmp/rmx-probe.swift
