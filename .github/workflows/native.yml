name: Rust six-platform checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: opencodex-runtime/experiments/rust-connect
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; explicit compiler below
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Verify native runner architecture
        shell: bash
        run: |
          node -e 'const expected=process.env.RUNNER_ARCH.toLowerCase(); if(process.arch!==expected) throw Error(`Node ${process.arch} is not ${expected}`)'
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$RUNNER_ARCH:$host" in
            X64:x86_64-*|ARM64:aarch64-*) echo "Native Rust host: $host" ;;
            *) echo "Unexpected Rust architecture: $RUNNER_ARCH $host"; exit 1 ;;
          esac
      - name: Restore disposable compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: opencodex-runtime/experiments/rust-connect/target
          key: native-v2-${{ matrix.os }}-${{ runner.arch }}-1.98.0-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-v2-${{ matrix.os }}-${{ runner.arch }}-1.98.0-${{ hashFiles('**/Cargo.lock') }}-
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Validate native npm launcher
        run: node --test npm/launcher.test.mjs
      - name: Validate experimental package builder on its supported platforms
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-2025' || matrix.os == 'macos-15'
        run: node --test npm/build.test.mjs
      - name: Lint all targets
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Compile test executables
        timeout-minutes: 20
        run: cargo test --locked --all-targets --no-run
      - name: Execute protocol and lifecycle tests
        timeout-minutes: 20
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=1 --show-output
      - name: Qualify pinned tunnel helper installation and reuse
        timeout-minutes: 12
        run: cargo test --locked --lib cloudflared::tests::pinned_platform_helper_installs_and_reuses_verified_cache -- --exact --ignored
      - name: Build release server and startup helper
        run: cargo build --locked --release --bin remodex-connect-native --bin remodex-startup
      - name: Offline experimental npm installation on its three supported platforms
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-2025' || matrix.os == 'macos-15'
        run: node npm/smoke.mjs target/release/remodex-connect-native${{ runner.os == 'Windows' && '.exe' || '' }} target/debug/chat-fixture${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Keep isolated test binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: opencodex-runtime/experiments/rust-connect/target/release/remodex-connect-native${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save disposable compiler cache
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: opencodex-runtime/experiments/rust-connect/target
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
