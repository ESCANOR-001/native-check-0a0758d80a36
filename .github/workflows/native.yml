name: Native platform checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Lint all targets
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - name: Execute protocol and lifecycle tests
        run: cargo +1.98.0 test --locked --all-targets -- --test-threads=1
      - name: Build native release binary
        run: cargo +1.98.0 build --locked --release --bin remodex-connect-native
