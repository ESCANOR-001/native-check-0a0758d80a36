name: Native platform checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Restore disposable compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target
          key: native-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-
      - name: Formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Lint all targets
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - name: Execute protocol and lifecycle tests
        run: cargo +1.98.0 test --locked --all-targets -- --test-threads=1 --show-output
      - name: Build native release binary
        run: cargo +1.98.0 build --locked --release --bin remodex-connect-native
