name: Native platform checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Install pinned source-export runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate source export and cancellation portability
        run: bun test migration/tests
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Restore disposable compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target
          key: native-lean-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-lean-${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-
      - name: Formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Validate native npm launcher
        run: node --test npm/launcher.test.mjs npm/build.test.mjs
      - name: Lint all targets
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - name: Qualify source handoff before the full suite
        run: cargo +1.98.0 test --locked --test upgrade_source_interop -- --show-output
      - name: Recheck bounded prompt-edit history preparation
        timeout-minutes: 10
        run: node npm/check-history-preparation.mjs
      - name: Execute protocol and lifecycle tests
        timeout-minutes: 15
        run: cargo +1.98.0 test --locked --all-targets --no-fail-fast -- --test-threads=1 --show-output
      - name: Recheck intermittent legacy projection shutdown
        timeout-minutes: 8
        run: node scripts/check-legacy-projection.mjs
      - name: Keep bounded hang diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: projection-diagnostic-${{ runner.os }}-${{ github.sha }}
          path: |
            legacy-hang-*
            history-preparation-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Qualify pinned tunnel helper installation and reuse
        timeout-minutes: 12
        run: cargo +1.98.0 test --locked --lib cloudflared::tests::pinned_platform_helper_installs_and_reuses_verified_cache -- --exact --ignored
      - name: Build native release binary
        run: cargo +1.98.0 build --locked --release --bin remodex-connect-native
      - name: Offline npm package installation and lifecycle
        run: node npm/smoke.mjs target/release/remodex-connect-native${{ runner.os == 'Windows' && '.exe' || '' }} target/debug/chat-fixture${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Keep isolated test binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: target/release/remodex-connect-native${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save disposable compiler cache
        if: always() && steps.compiler-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: target
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
