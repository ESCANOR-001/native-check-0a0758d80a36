name: macOS sign-in test controls
on:
  push:
    branches: [codex/onboard-login-macos-probe-20261119]
permissions:
  contents: read
jobs:
  menu:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check a disposable GUI sign-in and sign-out
        run: bash mac-verify.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-account-switcher
          path: ${{ runner.temp }}/macos-test-*.png
          retention-days: 1
