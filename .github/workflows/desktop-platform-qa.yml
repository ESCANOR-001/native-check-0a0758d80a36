name: Remodex Windows and macOS regression checks
on:
  push:
    branches: [codex/desktop-platform-qa-20261119]
permissions:
  contents: read
jobs:
  runtime:
    name: Runtime ${{ matrix.os }} shard ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-15-intel, macos-15]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        id: snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install locked runtime and dashboard packages
        id: packages
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
      - name: Build the dashboard
        working-directory: snapshot/opencodex-runtime/gui
        run: bun run build
      - name: All runtime tests
        run: bun scripts/test-file-shard.ts --shard=${{ matrix.shard }}/4
      - name: Runtime typecheck and source privacy scan
        if: ${{ !cancelled() && matrix.shard == 1 && steps.packages.outcome == 'success' }}
        shell: bash
        run: |
          bun run typecheck
          bun run privacy:scan
      - name: Dashboard unit tests
        if: ${{ !cancelled() && matrix.shard == 1 && steps.packages.outcome == 'success' }}
        working-directory: snapshot/opencodex-runtime/gui
        run: bun run test
      - name: Dashboard lint
        if: ${{ !cancelled() && matrix.shard == 1 && steps.packages.outcome == 'success' }}
        working-directory: snapshot/opencodex-runtime/gui
        run: bun run lint
      - name: Real OS credential store round trip
        if: ${{ !cancelled() && matrix.shard == 1 && steps.packages.outcome == 'success' }}
        run: bun scripts/keyring-smoke.ts
      - name: Runtime and dashboard dependency audit
        if: ${{ !cancelled() && matrix.shard == 2 && steps.packages.outcome == 'success' }}
        run: bun run audit:high
      - name: Build the documentation
        if: ${{ !cancelled() && matrix.shard == 3 && steps.packages.outcome == 'success' }}
        working-directory: snapshot/opencodex-runtime/docs-site
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Windows tray launch and lifecycle check
        if: ${{ !cancelled() && runner.os == 'Windows' && matrix.shard == 4 && steps.packages.outcome == 'success' }}
        run: bun scripts/test.ts tests/windows-tray.test.ts

  npm:
    name: npm ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-15-intel, macos-15]
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        id: snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
      - name: Verify native Node architecture
        run: node -e 'if (process.arch !== process.env.RUNNER_ARCH.toLowerCase()) throw Error("Unexpected Node architecture")'
      - name: Install npm dependencies and bundled Bun
        run: npm install --no-audit --no-fund
      - name: Build dashboard through the npm path
        run: npm run build:gui
      - name: Windows package install, startup, restart and uninstall
        if: runner.os == 'Windows'
        run: node scripts/windows-package-smoke.mjs
      - name: macOS package install, startup, restart and uninstall
        if: runner.os == 'macOS'
        run: node scripts/macos-package-smoke.mjs

  native:
    name: Rust bridge ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-15-intel, macos-15]
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime/experiments/rust-connect
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        id: snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Verify native Rust and Node architectures
        id: architecture
        run: |
          node -e 'if (process.arch !== process.env.RUNNER_ARCH.toLowerCase()) throw Error("Unexpected Node architecture")'
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$RUNNER_ARCH:$host" in X64:x86_64-*|ARM64:aarch64-*) echo "$host" ;; *) exit 1 ;; esac
      - name: Native formatting check
        run: cargo fmt --all -- --check
      - name: Native lint
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Native protocol, migration, authentication and lifecycle tests
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' }}
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=1
      - name: Native relay client tests
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' }}
        working-directory: snapshot/opencodex-runtime/experiments/relay-client
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=1
      - name: Native launcher verification
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' }}
        run: node --test npm/launcher.test.mjs
      - name: Native package builder verification
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' && (matrix.os == 'windows-2025' || matrix.os == 'macos-15') }}
        run: node --test npm/build.test.mjs
      - name: Download and verify the pinned tunnel helper
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' }}
        run: cargo test --locked --lib cloudflared::tests::pinned_platform_helper_installs_and_reuses_verified_cache -- --exact --ignored
      - name: Native Rust release build
        id: release
        if: ${{ !cancelled() && steps.architecture.outcome == 'success' }}
        run: cargo build --locked --release --bin remodex-connect-native --bin remodex-startup
      - name: Native npm install, upgrade and preserved pairing smoke tests
        if: ${{ !cancelled() && steps.release.outcome == 'success' && (matrix.os == 'windows-2025' || matrix.os == 'macos-15') }}
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          cargo build --locked --bin chat-fixture
          node npm/smoke.mjs "target/release/remodex-connect-native$suffix" "target/debug/chat-fixture$suffix"
          node npm/installation-smoke.mjs "target/release/remodex-connect-native$suffix"

  desktop:
    name: Native desktop packages ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: windows-x64, bundles: 'nsis,msi'}
          - {os: windows-11-arm, target: windows-arm64, bundles: nsis}
          - {os: macos-15-intel, target: darwin-x64, bundles: app}
          - {os: macos-15, target: darwin-arm64, bundles: app}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        id: snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Prepare locked dashboard and desktop package dependencies
        run: |
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile)
          bun run build:gui
      - name: Desktop typecheck
        working-directory: snapshot/opencodex-runtime/desktop
        run: bun run typecheck
      - name: Build native app bundles and installers
        id: build
        working-directory: snapshot/opencodex-runtime/desktop
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
        run: bun run build -- --ci --no-sign --bundles "$BUNDLE_TARGETS"
      - name: Create and verify a macOS disk image
        if: runner.os == 'macOS'
        working-directory: snapshot/opencodex-runtime/desktop
        env:
          TARGET_KEY: ${{ matrix.target }}
        run: |
          version=$(node -p "require('./package.json').version")
          case "$TARGET_KEY" in darwin-x64) arch='x64';; darwin-arm64) arch='aarch64';; esac
          staging=$(mktemp -d "$RUNNER_TEMP/remodex-dmg.XXXXXX")
          bundle_dir="src-tauri/target/release/bundle"
          mkdir -p "$bundle_dir/dmg"
          ditto "$bundle_dir/macos/Remodex.app" "$staging/Remodex.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Remodex -srcfolder "$staging" -format UDZO "$bundle_dir/dmg/Remodex_${version}_${arch}.dmg"
          hdiutil verify "$bundle_dir/dmg/Remodex_${version}_${arch}.dmg"
      - name: Verify installer metadata and checksums
        env:
          TARGET_KEY: ${{ matrix.target }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          bun scripts/collect-desktop-artifacts.ts --target-key "$TARGET_KEY" --version "$version" --bundle-dir desktop/src-tauri/target/release/bundle --out-dir "$RUNNER_TEMP/qa-installers"
      - name: Test the native desktop host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: snapshot/opencodex-runtime/desktop/src-tauri
        run: cargo test --locked --no-fail-fast -- --test-threads=1
