name: Remodex Windows and macOS regression checks
on:
  push:
    branches: [codex/desktop-platform-qa-20261119]
permissions:
  contents: read
jobs:
  desktop:
    name: Native desktop packages ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: windows-x64, bundles: 'nsis,msi'}
          - {os: windows-11-arm, target: windows-arm64, bundles: nsis}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        id: snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Prepare locked dashboard and desktop package dependencies
        run: |
          bun install --frozen-lockfile
          (cd gui && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile)
          bun run build:gui
      - name: Desktop typecheck
        working-directory: snapshot/opencodex-runtime/desktop
        run: bun run typecheck
      - name: Build native app bundles and installers
        id: build
        working-directory: snapshot/opencodex-runtime/desktop
        env:
          BUNDLE_TARGETS: ${{ matrix.bundles }}
        run: bun run build -- --ci --no-sign --bundles "$BUNDLE_TARGETS"
      - name: Create and verify a macOS disk image
        if: runner.os == 'macOS'
        working-directory: snapshot/opencodex-runtime/desktop
        env:
          TARGET_KEY: ${{ matrix.target }}
        run: |
          version=$(node -p "require('./package.json').version")
          case "$TARGET_KEY" in darwin-x64) arch='x64';; darwin-arm64) arch='aarch64';; esac
          staging=$(mktemp -d "$RUNNER_TEMP/remodex-dmg.XXXXXX")
          bundle_dir="src-tauri/target/release/bundle"
          mkdir -p "$bundle_dir/dmg"
          ditto "$bundle_dir/macos/Remodex.app" "$staging/Remodex.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Remodex -srcfolder "$staging" -format UDZO "$bundle_dir/dmg/Remodex_${version}_${arch}.dmg"
          hdiutil verify "$bundle_dir/dmg/Remodex_${version}_${arch}.dmg"
      - name: Verify installer metadata and checksums
        env:
          TARGET_KEY: ${{ matrix.target }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          bun scripts/collect-desktop-artifacts.ts --target-key "$TARGET_KEY" --version "$version" --bundle-dir desktop/src-tauri/target/release/bundle --out-dir "$RUNNER_TEMP/qa-installers"
      - name: Install and remove the unsigned Windows app
        shell: pwsh
        timeout-minutes: 7
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: '& "$env:GITHUB_WORKSPACE/desktop-install.ps1" -BundleDir "desktop/src-tauri/target/release/bundle"'
      - name: Verify a copied macOS app from the mounted disk image
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'macOS' }}
        run: |
          mount_path="$(mktemp -d "$RUNNER_TEMP/remodex-mount.XXXXXX")"
          install_path="$(mktemp -d "$RUNNER_TEMP/remodex-app.XXXXXX")"
          shopt -s nullglob
          images=(desktop/src-tauri/target/release/bundle/dmg/Remodex_*.dmg)
          test "${#images[@]}" = 1
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "${images[0]}"
          trap 'hdiutil detach "$mount_path"' EXIT
          ditto "$mount_path/Remodex.app" "$install_path/Remodex.app"
          plutil -lint "$install_path/Remodex.app/Contents/Info.plist"
          test -x "$install_path/Remodex.app/Contents/MacOS/remodex"
          file "$install_path/Remodex.app/Contents/MacOS/remodex"
      - name: Test the native desktop host
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: snapshot/opencodex-runtime/desktop/src-tauri
        run: cargo test --locked --no-fail-fast -- --test-threads=1
