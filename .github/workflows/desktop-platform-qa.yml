name: Rust bridge formatting and strict Clippy
on:
  push:
    branches: [codex/desktop-platform-qa-20261119]
permissions:
  contents: read
jobs:
  distribution:
    name: Rust checks ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-15-intel, macos-15]
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime/experiments/rust-connect
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy for all targets
        run: cargo clippy --locked --all-targets -- -D warnings
