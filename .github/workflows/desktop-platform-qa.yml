name: Remodex native Windows and macOS retest
on:
  push:
    branches: [codex/desktop-platform-qa-20261119]
permissions:
  contents: read
jobs:
  native:
    name: Native test rerun ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: desktop-platform-check-20261119
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-15-intel, macos-15]
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults:
      run:
        working-directory: snapshot/opencodex-runtime/experiments/rust-connect
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-snapshot
        id: snapshot
        with:
          key: ${{ secrets.REMODEX_DESKTOP_QA_SNAPSHOT_KEY }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
      - name: Rust library tests on Windows
        if: runner.os == 'Windows'
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --locked --lib -- --test-threads=1
      - name: Rust library tests on macOS
        if: runner.os == 'macOS'
        run: cargo test --locked --lib -- --test-threads=1
      - name: Native npm startup, upgrade, pairing and uninstall retest
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && (matrix.os == 'windows-2025' || matrix.os == 'macos-15') }}
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          cargo build --locked --release --bin remodex-connect-native --bin remodex-startup
          node npm/installation-smoke.mjs "target/release/remodex-connect-native$suffix"
