name: Desktop fixture diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: opencodex-runtime/experiments/rust-connect
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action; explicit compiler below
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Verify native runner architecture
        shell: bash
        run: |
          node -e 'const expected=process.env.RUNNER_ARCH.toLowerCase(); if(process.arch!==expected) throw Error(`Node ${process.arch} is not ${expected}`)'
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$RUNNER_ARCH:$host" in
            X64:x86_64-*|ARM64:aarch64-*) echo "Native Rust host: $host" ;;
            *) echo "Unexpected Rust architecture: $RUNNER_ARCH $host"; exit 1 ;;
          esac
      - name: Restore disposable compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: opencodex-runtime/experiments/rust-connect/target
          key: native-v2-${{ matrix.os }}-${{ runner.arch }}-1.98.0-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-v2-${{ matrix.os }}-${{ runner.arch }}-1.98.0-${{ hashFiles('**/Cargo.lock') }}-
      - name: Run desktop fixtures
        run: cargo test --locked --test desktop_refresh --test desktop_window --no-fail-fast -- --test-threads=1 --show-output
